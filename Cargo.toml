[package]
name = "mist"
version = "0.0.0-1.21.11"
edition = "2024"

[dependencies]
toml = "0.9.8"
serde = { version = "1.0.228", features = ["derive"] }
fancy-log = "0.1.0"
once_cell = "1.21.4"
tokio = { version = "1.50.0", features = ["full"] }
tokio-macros = "2.6.1"
anyhow = "1.0.102"
rsa = "0.9.10"
rand = "0.8"
sha1 = "0.10.6"
num-bigint = "0.4.6"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde_json = "1.0.149"
base64 = "0.22.1"
aes = "0.8.4"
cfb8 = "0.8.1"
hex = "0.4"
craftflow-nbt = "2.1.0"
chrono = "0.4.44"
postcard = { version = "1.0.2", features = ["alloc"] }
flate2 = "1.1.9"
futures = "0.3.32"
lazy_static = "1.5.0"
byteorder = "1.5.0"
console-subscriber = { version = "0.5.0", optional = true }
rayon = "1.11.0"
noise = "0.9.0"

[build-dependencies]
serde_json = "1.0.149"

[features]
default = []
console = ["console-subscriber"]
